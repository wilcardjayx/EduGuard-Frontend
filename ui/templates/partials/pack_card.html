<!-- Reusable Pack Card Partial -->
<div class="pack-card relative cursor-pointer select-none group" data-pack-id="{{ pack.id }}" onclick="togglePackCard(this)">
    <!-- Hidden checkbox state -->
    <input type="checkbox" class="pack-checkbox hidden" value="{{ pack.id }}" {% if checked_by_default %}checked{% endif %}>

    <!-- The Custom Folder Tab Geometry using SVG (Seamless fit) -->
    <div class="folder-tab-wrap absolute top-0 left-0 w-[114px] h-[28px] z-20 pointer-events-none">
        <svg width="114" height="28" viewBox="0 0 114 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="folder-tab-svg block">
            <path d="M0 22C0 9.5 9.5 0 20 0H78C86 0 93.5 4.8 96.5 12.2L98 16C99.5 19.5 103 22 106.8 22H114" stroke="#383838" stroke-width="1.5" class="tab-stroke"/>
            <path d="M0 22C0 9.5 9.5 0 20 0H78C86 0 93.5 4.8 96.5 12.2L98 16C99.5 19.5 103 22 106.8 22H114V28H0Z" fill="#181818" class="tab-fill"/>
        </svg>
        <span class="absolute top-1 left-4 font-mono text-[11px] font-bold text-charcoal-600 tracking-wider tab-text z-30">/ {{ "%02d"|format(loop.index) if loop else "01" }}</span>
    </div>

    <!-- Main Card Body -->
    <div class="card-body h-full border border-charcoal-500 rounded-[20px] rounded-tl-none p-5 sm:p-6 pt-10 sm:pt-12 flex flex-col justify-between transition-colors duration-300 relative overflow-hidden bg-charcoal-700">
        <!-- Unselected State Content: Centered Decorative Icon -->
        <div class="unselected-icon absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2E2E2E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <!-- Selected State Content: Hidden by default -->
        <div class="selected-content opacity-0 transition-opacity duration-300 flex-1 flex flex-col">
            <p class="font-mono text-xs sm:text-sm leading-relaxed mb-4 text-charcoal-800 line-clamp-4">{{ pack.description }}</p>
            <div class="mt-auto">
                <span class="inline-block px-3 py-1 bg-charcoal-800/10 rounded-full text-xs font-bold text-charcoal-800 mb-2">
                    {{ pack.checks|length }} Checks Loaded
                </span>
            </div>
        </div>

        <!-- Bottom Align Title & Check Badge -->
        <div class="mt-6 sm:mt-8 flex justify-between items-end relative z-10 gap-3">
            <h3 class="font-display font-medium text-lg sm:text-[20px] leading-tight card-title transition-colors duration-300 text-white flex-1">{{ pack.name }}</h3>
            
            <!-- Selected Checkmark Badge -->
            <div class="check-badge w-9 h-9 sm:w-10 sm:h-10 bg-charcoal-800 rounded-full flex items-center justify-center opacity-0 scale-50 transition-all duration-300 transform origin-center shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>
    </div>
</div>
